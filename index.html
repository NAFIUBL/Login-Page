<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h2>Welcome Back</h2>

        <p>Login to your account</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot?</a>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="or">
            OR
        </div>

        <div class="social-login">

            <button>G</button>

            <button>f</button>

        </div>

        <p class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
