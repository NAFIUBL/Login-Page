<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bill Productivity Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <span class="shape shape-1"></span>
    <span class="shape shape-2"></span>
    <span class="shape shape-3"></span>

    <div class="login-stage">

        <!-- Character standing beside / reaching toward the form -->
        <svg class="character" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">

            <ellipse cx="95" cy="285" rx="55" ry="10" fill="#0b0f2b" opacity="0.10"/>

            <!-- legs -->
            <rect x="70" y="210" width="18" height="65" rx="9" fill="#3b3560"/>
            <rect x="100" y="210" width="18" height="65" rx="9" fill="#3b3560"/>
            <rect x="66" y="268" width="26" height="12" rx="6" fill="#1c1d2e"/>
            <rect x="96" y="268" width="26" height="12" rx="6" fill="#1c1d2e"/>

            <!-- body -->
            <rect x="58" y="140" width="72" height="80" rx="26" fill="#7c6cf0"/>

            <!-- reaching arm (toward the form on the right) -->
            <g class="reach-arm">
                <rect x="118" y="150" width="60" height="16" rx="8" fill="#7c6cf0"/>
                <circle cx="182" cy="158" r="11" fill="#ffd58a"/>
            </g>

            <!-- other arm resting -->
            <rect x="48" y="155" width="16" height="46" rx="8" fill="#6a59e0"/>

            <!-- head -->
            <circle cx="94" cy="112" r="34" fill="#ffd58a"/>
            <path d="M64 108 q30 -24 60 0" stroke="#3a2c1a" stroke-width="5" fill="none" stroke-linecap="round"/>
            <circle cx="84" cy="112" r="4.5" fill="#3a2c1a"/>
            <circle cx="106" cy="112" r="4.5" fill="#3a2c1a"/>
            <path d="M86 126 q8 6 16 0" stroke="#3a2c1a" stroke-width="3" fill="none" stroke-linecap="round"/>

        </svg>

        <div class="login-card">

            <form id="loginForm">

                <div class="field">
                    <input type="text" id="username" placeholder=" " autocomplete="username" required>
                    <label for="username">Username</label>
                </div>

                <div class="field">
                    <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
                    <label for="password">Password</label>
                </div>

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
